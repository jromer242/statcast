data_tests:
  - name: assert_statcast_games_have_one_schedule_row
    description: >
      Join coverage between Statcast and the MLB schedule. Fails for any regular-season or
      postseason game_pk in stg_savant__pitches that has zero or several rows in
      stg_mlb__games, or whose official_date differs from Statcast's game_date.
      Usual causes: ingest_schedule.py wasn't run for a season that ingest.py loaded,
      or the schedule dedupe stopped producing one row per game_pk.

  - name: assert_game_has_one_venue
    description: >
      Fails if a game with pitches thrown was played in more than one venue, e.g. a
      suspended game resumed in a different park. stg_mlb__games keeps one venue_id per
      game_pk, so pitches from the first part would get the wrong park. Runs on the raw
      schedule; ignores Postponed and Cancelled rows. If it fails, venues have to be
      assigned per part of the game instead of per game_pk.

  - name: assert_every_game_has_venue_season
    description: >
      Every game in stg_mlb__games has a stg_mlb__venues row for its venue_id and season.
      Fails when ingest_venues.py wasn't run for a season that ingest_schedule.py loaded.

  - name: assert_home_parks_have_dimensions
    description: >
      Every venue with 20+ completed games in a season has a stg_savant__park_dimensions
      row for that season. One-off neutral sites are expected to be missing and are
      excluded by the 20-game threshold. Fails when ingest_park_dimensions.py wasn't run
      for a season.

  - name: assert_park_factor_window_ends_in_season
    description: >
      Every Savant park factor window ends in its labeled season and spans
      `rolling_years` seasons. dim_venue_seasons' leakage rule (use season - 1) depends
      on this; if Savant changed how it labels windows, the mart would use future data.

  - name: assert_home_parks_have_prior_park_factors
    description: >
      Warning only. Lists real home parks (20+ games) with no 3-year park factor from the
      previous season. Expected for a team's first seasons in a new park; anything else
      means ingest_park_factors.py wasn't run for the previous season.

  - name: assert_batted_balls_match_pitches
    description: >
      Every in-play regular-season or postseason pitch in stg_savant__pitches is in
      fct_batted_balls, and nothing else is. Guards the incremental build against
      drift (re-pulled dates older than the lookback window, deleted pitches).
      Fix with --full-refresh.

  - name: assert_spray_angle_sign_matches_fielders
    description: >
      Balls caught by the left fielder average a negative spray angle and by the right
      fielder a positive one, every season. Guards the sign convention that
      pull_angle_deg and the wall interpolation depend on.

  - name: assert_over_fence_hrs_reach_the_wall
    description: >
      No more than 3% of a season's over-the-fence home runs land short of the
      interpolated wall (under 1% on 2024-26). Catches a broken wall interpolation.
