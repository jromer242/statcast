name: statcast
version: "1.0.0"
profile: statcast

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Raw Parquet written by scripts/ingest.py, relative to this dbt/ folder.
  raw_statcast_glob: "../data/raw/statcast/**/*.parquet"
  # Raw JSON lines written by scripts/ingest_schedule.py.
  raw_mlb_schedule_glob: "../data/raw/mlb/schedule/**/*.jsonl"
  # Raw JSON lines written by scripts/ingest_venues.py and scripts/ingest_park_dimensions.py.
  raw_mlb_venues_glob: "../data/raw/mlb/venues/**/*.jsonl"
  raw_savant_park_dimensions_glob: "../data/raw/savant/park_dimensions/**/*.jsonl"
  # Raw JSON lines written by scripts/ingest_park_factors.py.
  raw_savant_park_factors_glob: "../data/raw/savant/park_factors/**/*.jsonl"
  raw_savant_park_environment_glob: "../data/raw/savant/park_environment/**/*.jsonl"

models:
  statcast:
    staging:
      # Table, not view: a view would store the relative Parquet path and break when
      # queried from anywhere but dbt/ (e.g. notebooks). It also dedupes once, at build.
      +materialized: table
