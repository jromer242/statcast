name: statcast
version: "1.0.0"
profile: statcast

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Folders with the raw files, relative to this dbt/ folder. `--target ci` reads
  # raw_dir_ci, the small committed sample built by scripts/make_ci_fixtures.py, and
  # writes to its own database (profiles.yml). Tying both to the target means fixture
  # data can never be built into the dev database.
  raw_dir: "../data/raw"
  raw_dir_ci: "../ci/fixtures/raw"
  # The globs below are relative to raw_dir.
  # Raw Parquet written by scripts/ingest.py.
  raw_statcast_glob: "statcast/**/*.parquet"
  # Raw JSON lines written by scripts/ingest_schedule.py.
  raw_mlb_schedule_glob: "mlb/schedule/**/*.jsonl"
  # Raw JSON lines written by scripts/ingest_venues.py and scripts/ingest_park_dimensions.py.
  raw_mlb_venues_glob: "mlb/venues/**/*.jsonl"
  # Raw JSON lines written by scripts/ingest_players.py.
  raw_mlb_players_glob: "mlb/players/**/*.jsonl"
  raw_savant_park_dimensions_glob: "savant/park_dimensions/**/*.jsonl"
  # Raw JSON lines written by scripts/ingest_park_factors.py.
  raw_savant_park_factors_glob: "savant/park_factors/**/*.jsonl"
  raw_savant_park_environment_glob: "savant/park_environment/**/*.jsonl"

  # fct_batted_balls: days before the newest loaded game to rebuild on each incremental run.
  batted_balls_lookback_days: 7
  # fct_batted_balls: spray angle of the gap measurements (Savant doesn't publish it).
  # 17.5-22.5 separate home runs about equally well on 2024-26; see notebook 06.
  fence_gap_angle_deg: 20

models:
  statcast:
    staging:
      # Table, not view: a view would store the relative Parquet path and break when
      # queried from anywhere but dbt/ (e.g. notebooks). It also dedupes once, at build.
      +materialized: table
    marts:
      # Marts are the tables analyses and models read from.
      +materialized: table
    semantic:
      # The time spine MetricFlow needs. Semantic models and metrics are defined in
      # each mart's YAML, next to its columns.
      +materialized: table
    app:
      # Small extracts for the Streamlit app, exported to app/data/ as Parquet.
      +materialized: table
