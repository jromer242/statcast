seeds:
  - name: savant_field_dictionary
    description: >
      Data dictionary for raw Savant columns, generated by scripts/scrape_savant_docs.py
      from https://baseballsavant.mlb.com/csv-docs. Don't edit by hand; re-run the script.
    config:
      column_types:
        field: varchar
        stg_column: varchar
        description: varchar
        source: varchar
    columns:
      - name: field
        description: Raw Savant column name.
        data_tests: [unique, not_null]
      - name: stg_column
        description: Column name in stg_savant__pitches. Null when staging drops the column.
        data_tests: [unique]
      - name: description
        data_tests: [not_null]
      - name: source
        description: savant (scraped) or manual (written in the script where Savant has no entry).
        data_tests:
          - accepted_values:
              arguments:
                values: [savant, manual]
