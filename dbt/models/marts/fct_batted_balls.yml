models:
  - name: fct_batted_balls
    description: >
      One row per batted ball (pitch put in play) in regular-season and postseason
      games, with its venue and where it went relative to that park's wall. The input
      table for a batted-ball home run model: replay a hitter's batted balls against
      every park's walls to estimate park fit.


      Built incrementally (rebuilds the last `batted_balls_lookback_days` days each run).
      Run `dbt build --full-refresh --select fct_batted_balls` after loading park
      dimensions, re-pulling older pitches, or changing the model.


      Contact columns (launch_speed, launch_angle, hit_distance, spray) are outcomes of
      the pitch. Use them for batted-ball models, never to predict a plate appearance
      before it happens.
    config:
      contract:
        enforced: true
    # Semantic layer: contact quality and how far home runs carried. Includes the
    # postseason unless filtered on season_phase. Launch metrics only use balls with both
    # exit velocity and launch angle (has_launch_data); a few hundred have just one, and
    # counting them in a rate's numerator but not its denominator would skew it.
    semantic_model: true
    agg_time_dimension: game_date
    derived_semantics:
      entities:
        - name: venue_season
          type: foreign
          expr: "cast(venue_id as string) || '-' || cast(season as string)"
      dimensions:
        - name: season_phase
          type: categorical
          description: regular or postseason. Filter on regular for official season totals.
          expr: "case when game_type = 'R' then 'regular' else 'postseason' end"
    metrics:
      - name: batted_balls
        label: Batted balls (BBE)
        description: Balls in play with Statcast launch data (exit velocity and launch angle).
        agg: sum
        expr: case when has_launch_data then 1 else 0 end
      - name: avg_exit_velocity
        label: Average exit velocity (mph)
        agg: average
        expr: case when has_launch_data then launch_speed end
      - name: max_exit_velocity
        label: Max exit velocity (mph)
        agg: max
        expr: case when has_launch_data then launch_speed end
      - name: avg_launch_angle
        label: Average launch angle (degrees)
        agg: average
        expr: case when has_launch_data then launch_angle end
      - name: avg_bat_speed
        label: Average bat speed (mph)
        description: Bat tracking, on swings Statcast measured. Savant's leaderboards use only the fastest 90% of swings, so this runs lower.
        agg: average
        expr: bat_speed
      - name: hard_hit_balls
        hidden: true
        agg: sum
        expr: case when has_launch_data and launch_speed >= 95 then 1 else 0 end
      - name: hard_hit_rate
        label: Hard-hit rate
        description: Share of batted balls hit 95 mph or harder.
        type: ratio
        numerator: hard_hit_balls
        denominator: batted_balls
      - name: sweet_spot_balls
        hidden: true
        agg: sum
        expr: case when has_launch_data and launch_angle between 8 and 32 then 1 else 0 end
      - name: sweet_spot_rate
        label: Sweet-spot rate
        description: Share of batted balls with a launch angle from 8 to 32 degrees.
        type: ratio
        numerator: sweet_spot_balls
        denominator: batted_balls
      - name: avg_home_run_distance
        label: Average home run distance (ft)
        description: Projected distance of home runs (Statcast hit_distance), inside-the-park included.
        agg: average
        expr: case when is_home_run then hit_distance end
      - name: avg_home_run_clearance
        label: Average home run clearance (ft)
        description: >
          How far past the wall home runs over the fence went: distance minus the wall
          distance at that spray angle. Small values are wall-scrapers that wouldn't be
          out in a bigger park. Null where the park has no measured walls.
        agg: average
        expr: case when is_over_fence_hr then distance_past_wall_ft end
    columns:
      # keys
      - name: pitch_id
        data_type: string
        entity:
          name: batted_ball
          type: primary
        description: The pitch that was put in play (game_pk-at_bat_number-pitch_number). Primary key.
        constraints: [{type: primary_key}]
        data_tests:
          # BigQuery records primary keys but doesn't enforce them (DuckDB does), so
          # uniqueness is tested there instead.
          - unique:
              config:
                enabled: "{{ target.type == 'bigquery' }}"
      - name: game_pk
        data_type: bigint
        entity:
          name: game
          type: foreign
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_pk
      - name: at_bat_number
        data_type: bigint
        description: Joins to fct_plate_appearances with game_pk (pa_id = game_pk-at_bat_number).
      - name: pitch_number
        data_type: bigint
        description: Pitch of the at-bat (1 = first).
      - name: game_date
        data_type: date
        granularity: day
        # The long form: the shorthand `dimension: time` loses the granularity in dbt 1.12.
        dimension:
          type: time
      - name: season
        data_type: integer
        dimension: categorical
        constraints: [{type: not_null}]
      - name: game_type
        data_type: string
        dimension: categorical
      - name: venue_id
        data_type: bigint
        description: Where the game was played (not the home team's usual park).
        constraints: [{type: not_null}]

      # players
      - name: batter_id
        data_type: bigint
        entity:
          name: batter
          type: foreign
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: pitcher_id
        data_type: bigint
        entity:
          name: pitcher
          type: foreign
        constraints: [{type: not_null}]
      - name: batter_stand
        data_type: string
        dimension: categorical
        description: Side the batter hit from on this pitch (a switch hitter's side depends on the pitcher).
        data_tests:
          - accepted_values:
              arguments:
                values: ['L', 'R']
      - name: pitcher_throws
        data_type: string
        dimension: categorical

      # situation before the pitch
      - name: inning
        data_type: bigint
      - name: inning_topbot
        data_type: string
      - name: outs_when_up
        data_type: bigint
      - name: balls
        data_type: bigint
        description: Count before the pitch.
      - name: strikes
        data_type: bigint

      # pitch
      - name: pitch_type
        data_type: string
        dimension: categorical
        description: Savant pitch code (FF four-seam, SL slider, CH changeup...).
      - name: release_speed
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Pitch speed out of the hand, mph.
      - name: plate_x
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Horizontal location crossing the plate, feet from the center, catcher's view.
      - name: plate_z
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Height crossing the plate, feet above the ground.

      # swing (bat tracking, 2023 onward)
      - name: bat_speed
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Speed of the sweet spot at contact, mph. Null when bat tracking missed the swing.
      - name: swing_length
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Distance the bat head traveled, feet.
      - name: attack_angle
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Vertical angle of the bat's path at contact, degrees.

      # contact
      - name: batted_ball_type
        data_type: string
        dimension: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['ground_ball', 'line_drive', 'fly_ball', 'popup']
      - name: launch_speed
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Exit velocity, mph.
      - name: launch_angle
        data_type: bigint
        description: Vertical launch angle, whole degrees.
      - name: hit_distance
        data_type: bigint
        description: Projected distance in feet (where it landed or would have landed).
      - name: hc_x
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Savant's hit coordinate, x (pixels on a field diagram). Input to spray_angle_deg.
      - name: hc_y
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
      - name: has_launch_data
        data_type: bool
        description: False for under 1% of batted balls the tracking system missed. Exclude or impute before modeling.
      - name: has_hit_coordinates
        data_type: bool
        description: False when Savant has no hit coordinates, so no spray angle or wall.

      # direction
      - name: spray_angle_deg
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: >
          Horizontal direction from home plate: 0 is dead center, -45 the left field line,
          +45 the right field line. Computed from Savant's hit coordinates (hc_x, hc_y).
      - name: pull_angle_deg
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: spray_angle_deg with the sign flipped for right-handed batters, so positive always means the pull side.
      - name: spray_direction
        data_type: string
        dimension: categorical
        description: pull, center or oppo, split at +-15 degrees of pull_angle_deg.
        data_tests:
          - accepted_values:
              arguments:
                values: ['pull', 'center', 'oppo']

      # the wall where the ball went
      - name: wall_distance_at_spray_ft
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: >
          Distance to the wall at the ball's spray angle, linearly interpolated between
          Savant's measured line, gap and center distances. Gap angle is the
          fence_gap_angle_deg var. Null at neutral sites without measured dimensions.
      - name: wall_height_at_spray_ft
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Wall height at the ball's spray angle, interpolated the same way.
      - name: distance_past_wall_ft
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: hit_distance minus wall_distance_at_spray_ft. Positive means the ball would have landed beyond the wall.

      # labels
      - name: pa_event
        data_type: string
        description: How the plate appearance ended. Same values as fct_plate_appearances.pa_event.
      - name: is_home_run
        data_type: bool
        dimension: categorical
        description: Any home run, including inside-the-park.
        constraints: [{type: not_null}]
      - name: is_inside_the_park_hr
        data_type: bool
      - name: is_over_fence_hr
        data_type: bool
        dimension: categorical
        description: Home runs that cleared the wall. The label for park-fit models, since inside-the-park home runs don't depend on the walls.

      # Savant's expected stats from launch speed and angle (benchmarks to beat)
      - name: xba
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        description: Expected batting average from launch speed and angle.
      - name: xslg
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
      - name: xwoba
        data_type: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"

      # lineage
      - name: _ingested_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamp with time zone' }}"
        description: When the pitch's raw file was written by scripts/ingest.py.
