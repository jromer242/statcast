models:
  - name: stg_mlb__games
    description: >
      One row per MLB game (regular season + postseason) from the Stats API schedule.
      Joins to Statcast on game_pk and gives each game its venue_id. Duplicate game_pks
      (postponed and suspended games) are resolved by keeping the latest scheduled start.
    columns:
      - name: game_pk
        description: Game ID. Same value as Statcast's game_pk.
        data_tests:
          - unique
          - not_null
      - name: venue_id
        description: MLB venue ID. Join key for venue dimensions and Savant park factors.
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
      - name: away_team_id
        data_tests:
          - not_null
      - name: official_date
        description: The game's date as MLB records it. Matches Statcast game_date, including for suspended games.
        data_tests:
          - not_null
      - name: game_datetime_utc
        description: Scheduled start time in UTC (the `Z` in the API). Don't derive the game date from it.
      - name: game_type
        description: R regular season, F wild card, D division series, L LCS, W World Series.
        data_tests:
          - accepted_values:
              arguments:
                values: ['R', 'F', 'D', 'L', 'W']
      - name: status
        description: Final, Completed Early, Cancelled, Postponed, or a live status (Scheduled, In Progress) during the season.
      - name: double_header
        description: N = not a doubleheader, Y = traditional (one ticket, back to back), S = split (separate admissions).
        data_tests:
          - accepted_values:
              arguments:
                values: ['N', 'Y', 'S']
      - name: home_score
        description: Final score. Post-game outcome; never a pre-game feature.
      - name: away_score
        description: Final score. Post-game outcome; never a pre-game feature.

  - name: stg_mlb__venues
    description: >
      One row per venue per season from the Stats API venues endpoint: location, elevation,
      orientation, roof, turf, capacity and posted dimensions. Venues change between seasons
      (walls moved, capacity, names), so join on (venue_id, season), never venue_id alone.
      Neutral sites (London, Tokyo, Williamsport...) usually lack elevation and azimuth.
    data_tests:
      - unique:
          arguments:
            column_name: "cast(venue_id as string) || '-' || cast(season as string)"
    columns:
      - name: venue_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: venue_name
        data_tests: [not_null]
      - name: elevation_ft
        description: Feet above sea level. Null for most one-off neutral sites.
      - name: azimuth_deg
        description: >
          Compass direction from home plate toward center field (0 = north, 90 = east).
          Combine with wind direction to get wind blowing out vs in. Null for most neutral sites.
      - name: roof_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Open', 'Retractable', 'Dome']
      - name: turf_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Grass', 'Artificial Turf']
      - name: posted_center_ft
        description: Posted (wall sign) distance, not measured. Neutral sites often show round placeholder values like 400.

  - name: stg_mlb__players
    description: >
      One row per player per season from the Stats API players endpoint: name, birth
      date, bats, throws, and that season's listed position, height and weight. Join
      on (player_id, season) for season-specific values, or use dim_players for one row
      per player.
    data_tests:
      - unique:
          arguments:
            column_name: "cast(player_id as string) || '-' || cast(season as string)"
    columns:
      - name: player_id
        description: MLBAM id, the same id Statcast uses for batter_id and pitcher_id.
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: full_name
        data_tests: [not_null]
      - name: bats
        description: L, R or S (switch).
      - name: height_in
        description: Listed height in inches, parsed from text like 6' 2".
        data_tests: [not_null]
