models:
  - name: stg_savant__pitches
    description: >
      One row per pitch from Baseball Savant, deduplicated across overlapping raw pulls.
      Includes spring training (game_type = 'S') and postseason; filter downstream.
      Field definitions: https://baseballsavant.mlb.com/csv-docs
    columns:
      - name: pitch_id
        description: Surrogate key, "game_pk-at_bat_number-pitch_number".
        data_tests:
          - unique
          - not_null

      - name: game_pk
        description: MLB game ID.
        data_tests: [not_null]

      - name: game_date
        data_tests: [not_null]

      - name: game_type
        description: R regular, F wild card, D division series, L LCS, W World Series, S spring training, E exhibition, A All-Star.
        data_tests:
          - accepted_values:
              arguments:
                values: [R, F, D, L, W, S, E, A]

      - name: batter_id
        data_tests: [not_null]

      - name: pitcher_id
        data_tests: [not_null]

      - name: pitcher_name
        description: Pitcher's name. Savant's raw column is called player_name.

      - name: inning_topbot
        data_tests:
          - accepted_values:
              arguments:
                values: [Top, Bot]

      - name: batter_stand
        data_tests:
          - accepted_values:
              arguments:
                values: [L, R]

      - name: pitcher_throws
        data_tests:
          - accepted_values:
              arguments:
                values: [L, R]

      - name: pitch_result_type
        description: B ball, S strike (including fouls), X ball in play.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [B, S, X]

      - name: pa_event
        description: Outcome of the plate appearance (single, strikeout, ...). Null on every pitch except the last of a PA.

      - name: xwoba
        description: Expected wOBA from launch speed and angle. Only on batted balls.

      - name: delta_run_exp
        description: Change in run expectancy caused by this pitch. An outcome; leaks if used as a feature for the same pitch.

      - name: pitcher_days_until_next_game
        description: Days until the pitcher's next game. Known only in hindsight; never use as a model input.

      - name: _source_file
        description: Raw Parquet file this row came from.

      - name: _ingested_at
        description: When ingest.py pulled this row (UTC). Null for files written before this column was added.

  - name: stg_savant__park_dimensions
    description: >
      One row per MLB home park per season: Savant's measured fence distances and wall
      heights. Prefer these over the posted distances in stg_mlb__venues. Join on
      (venue_id, season). One-off neutral sites have no row. Available from 2015.
    data_tests:
      - unique:
          arguments:
            column_name: "cast(venue_id as string) || '-' || cast(season as string)"
    columns:
      - name: venue_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: walls_changed
        description: True when the park's walls moved or changed height since the previous season.
      - name: distance_cf_ft
        description: Measured distance to the center-field wall, feet.
        data_tests: [not_null]
      - name: height_highest_ft
        description: Tallest point of the outfield wall, feet (Fenway's Green Monster is about 37).
        data_tests: [not_null]
      - name: venue_name
        description: Savant's current name for the park, even in past seasons. Use stg_mlb__venues for the name at the time.
      - name: avg_hr_distance_ft
        description: >
          Average home run distance in this park this season. An outcome of the same
          season's batted balls: leaks if used as a feature for that season.

  - name: stg_savant__park_factors
    description: >
      Savant park factor indexes (100 = league average), one row per park, season, rolling
      window (1 or 3 seasons) and batter side (All, L, R). Values describe the window that
      ends in `season`; for modeling season S use season S-1 (see dim_venue_seasons).
      Parks need a minimum sample, so one-off neutral sites and parks in their first
      seasons (for the 3-season window) are missing.
    data_tests:
      - unique:
          arguments:
            column_name: "cast(venue_id as string) || '-' || cast(season as string) || '-' || cast(rolling_years as string) || '-' || cast(bat_side as string)"
    columns:
      - name: venue_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: rolling_years
        description: Seasons in the window ending in `season`. 1 reacts quickly to changes; 3 is less noisy.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 3]
                quote: false
      - name: bat_side
        description: All, L (left-handed batters) or R (right-handed batters).
        data_tests:
          - accepted_values:
              arguments:
                values: ['All', 'L', 'R']
      - name: window_last_season
        description: Last season in the window. Always equals `season`.
      - name: n_pa
        description: Plate appearances behind the index. Small samples make noisy indexes.
        data_tests: [not_null]
      - name: pf_hr
        description: Home run index. 110 = 10% more home runs than an average park.
        data_tests: [not_null]
      - name: pf_runs
        data_tests: [not_null]

  - name: stg_savant__park_environment
    description: >
      Savant's extra-distance view (2016+): how many extra feet a fly ball carries in each
      park versus average, split into elevation, temperature, roof and other environment.
      One row per park per season. Describes that season; use the previous season's
      values for modeling.
    data_tests:
      - unique:
          arguments:
            column_name: "cast(venue_id as string) || '-' || cast(season as string)"
    columns:
      - name: venue_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: extra_distance_ft
        description: Total extra carry versus an average park, feet. Coors Field is about +20.
        data_tests: [not_null]
