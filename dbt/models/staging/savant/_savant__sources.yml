sources:
  - name: savant
    description: Raw Baseball Savant Statcast pulls, written as Parquet by scripts/ingest.py.
    tables:
      - name: statcast_raw
        description: >
          One row per pitch per pull. Files can overlap (re-pulled date ranges), so the
          same pitch may appear more than once; staging deduplicates. `season` comes from
          the season=YYYY folder name and `filename` records which file a row came from.
        config:
          external_location: >-
            read_parquet('{{ var("raw_dir_ci") if target.name == "ci" else var("raw_dir") }}/{{ var("raw_statcast_glob") }}',
                         hive_partitioning = true,
                         union_by_name = true,
                         filename = true)

      - name: park_dimensions_raw
        description: >
          One line per MLB home park per season from the "dimensions" view of Savant's park
          factors leaderboard, written by scripts/ingest_park_dimensions.py. One-off neutral
          sites aren't included. Each run overwrites the season's file, so
          (venue_id, season_id) is unique. Available from 2015.
        config:
          external_location: >-
            read_json('{{ var("raw_dir_ci") if target.name == "ci" else var("raw_dir") }}/{{ var("raw_savant_park_dimensions_glob") }}',
                      format = 'newline_delimited',
                      hive_partitioning = true,
                      union_by_name = true,
                      filename = true,
                      sample_size = -1)

      - name: park_factors_raw
        description: >
          Savant park factor indexes (100 = league average), written by
          scripts/ingest_park_factors.py. One line per park per season per rolling window
          (1 or 3 seasons) per batter side (All, L, R). Every value arrives as a string.
          Computed from that season's batted balls, so these describe the past.
        config:
          external_location: >-
            read_json('{{ var("raw_dir_ci") if target.name == "ci" else var("raw_dir") }}/{{ var("raw_savant_park_factors_glob") }}',
                      format = 'newline_delimited',
                      hive_partitioning = true,
                      union_by_name = true,
                      filename = true,
                      sample_size = -1)

      - name: park_environment_raw
        description: >
          Savant's "extra distance" view (2016+): how far a fly ball carries in each park
          relative to average, split into elevation, temperature, roof and other
          environment. One line per park per season. Every value arrives as a string.
        config:
          external_location: >-
            read_json('{{ var("raw_dir_ci") if target.name == "ci" else var("raw_dir") }}/{{ var("raw_savant_park_environment_glob") }}',
                      format = 'newline_delimited',
                      hive_partitioning = true,
                      union_by_name = true,
                      filename = true,
                      sample_size = -1)
