sources:
  - name: savant
    description: Raw Baseball Savant Statcast pulls, written as Parquet by scripts/ingest.py.
    tables:
      - name: statcast_raw
        description: >
          One row per pitch per pull. Files can overlap (re-pulled date ranges), so the
          same pitch may appear more than once; staging deduplicates. `season` comes from
          the season=YYYY folder name and `filename` records which file a row came from.
        config:
          external_location: >-
            read_parquet('{{ var("raw_statcast_glob") }}',
                         hive_partitioning = true,
                         union_by_name = true,
                         filename = true)

      - name: park_dimensions_raw
        description: >
          One line per MLB home park per season from the "dimensions" view of Savant's park
          factors leaderboard, written by scripts/ingest_park_dimensions.py. One-off neutral
          sites aren't included. Each run overwrites the season's file, so
          (venue_id, season_id) is unique. Available from 2015.
        config:
          external_location: >-
            read_json('{{ var("raw_savant_park_dimensions_glob") }}',
                      format = 'newline_delimited',
                      hive_partitioning = true,
                      union_by_name = true,
                      filename = true,
                      sample_size = -1)
